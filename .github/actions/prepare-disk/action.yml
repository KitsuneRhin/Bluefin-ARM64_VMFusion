name: "Prepare runner disk"
description: >
  Free up space on a GitHub-hosted runner and report the result. On
  ubuntu-24.04-arm there is a single ~145 GB root disk (no separate /mnt
  volume), so relocating podman storage buys nothing — reclaiming is what frees
  space. See docs/ARM64-ROADMAP.md Phase 3.

inputs:
  report-label:
    description: "Label to tag the disk report with in the step summary."
    required: false
    default: "after reclaim"

runs:
  using: "composite"
  steps:
    - name: Disk baseline (before reclaim)
      shell: bash
      run: |
        echo "### Disk: baseline (before reclaim)" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        df -h / 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    # Reclaim first and foremost. Pinned to v1.3.1. The action rm -rf's each
    # target with `|| true`, so absent paths on arm64 are skipped harmlessly.
    #
    # NOTE: we do NOT relocate podman storage. These runners have one root disk
    # (/mnt is a directory on it, not a separate volume), so a move frees nothing
    # — and relocating rootful storage baked the /mnt path into the libpod DB,
    # which then mismatched bootc-image-builder's default /var/lib/containers
    # mount ("database configuration mismatch"). Default storage paths keep the
    # host and the bib container in agreement.
    - name: Reclaim space
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Disk report (${{ inputs.report-label }})
      shell: bash
      run: |
        echo "### Disk: ${{ inputs.report-label }}" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        df -h / 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
